name: CI — Python

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/ai-adaptive/**'
      - 'apps/ai-tutor/**'
      - 'apps/ai-content/**'
      - 'apps/ai-analytics/**'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ai-adaptive
        working-directory: apps/ai-adaptive
        run: |
          pip install -r requirements.txt
          pytest test_adaptive.py -v
