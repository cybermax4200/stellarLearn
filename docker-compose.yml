version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stellarlearn
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d stellarlearn']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  service-auth:
    build:
      context: .
      dockerfile: apps/service-auth/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      redis:
        condition: service_healthy

  service-courses:
    build:
      context: .
      dockerfile: apps/service-courses/Dockerfile
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/stellarlearn}
    depends_on:
      postgres:
        condition: service_healthy

  ai-triggers:
    build:
      context: .
      dockerfile: apps/ai-triggers/Dockerfile
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      CREDENTIAL_CONTRACT_ID: ${CREDENTIAL_CONTRACT_ID}
      REWARD_CONTRACT_ID: ${REWARD_CONTRACT_ID}
      STELLAR_CONTRACT_TRIGGER_SECRET: ${STELLAR_CONTRACT_TRIGGER_SECRET}

  storage:
    build:
      context: .
      dockerfile: apps/storage/Dockerfile
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      IPFS_API_KEY: ${IPFS_API_KEY}

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://service-auth:3001
      COURSES_SERVICE_URL: http://service-courses:3002
      TRIGGERS_SERVICE_URL: http://ai-triggers:3003
      STORAGE_SERVICE_URL: http://storage:3004
      TUTOR_SERVICE_URL: http://ai-tutor:8001
      ADAPTIVE_SERVICE_URL: http://ai-adaptive:8002
    depends_on:
      - service-auth
      - service-courses
      - ai-triggers
      - storage

  ai-adaptive:
    build:
      context: ./apps/ai-adaptive
      dockerfile: Dockerfile
    ports:
      - '8002:8002'
    environment:
      PORT: 8002

  ai-tutor:
    build:
      context: ./apps/ai-tutor
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    environment:
      PORT: 8001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}

  app-learner:
    build:
      context: .
      dockerfile: apps/app-learner/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_COURSES_URL: http://localhost:3002
      NEXT_PUBLIC_STELLAR_PASSPHRASE: 'Test SDF Network ; September 2015'
    depends_on:
      - service-auth
      - service-courses

volumes:
  postgres_data:
